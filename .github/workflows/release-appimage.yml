name: Release AppImages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifact names (e.g. 2.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk wget xvfb

      - name: Resolve version
        id: version
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            python3 -c 'from githelper import __version__ as v; print(f"value={v}")' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify CLI imports
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -c "from githelper.cli_app import main"
          python3 cli/githelper.py --help
          python3 cli/githelper.py config path

      - name: Build AppImages
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: x86_64
          PYTHONPATH: ${{ github.workspace }}
        run: |
          chmod +x packaging/appimage/build.sh
          packaging/appimage/build.sh all

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appimages-${{ steps.version.outputs.value }}
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
          body: |
            ## AppImages (x86_64)

            Download and run on most modern Linux distributions:

            ```bash
            chmod +x githelper-cli-${{ steps.version.outputs.value }}-x86_64.AppImage
            ./githelper-cli-${{ steps.version.outputs.value }}-x86_64.AppImage --help

            chmod +x githelper-gui-${{ steps.version.outputs.value }}-x86_64.AppImage
            ./githelper-gui-${{ steps.version.outputs.value }}-x86_64.AppImage
            ```

            **Requirements:** `git` and `openssh-client` must be installed and available on your `PATH`.
            The GUI AppImage requires a graphical desktop session.

            See the [readme](https://github.com/${{ github.repository }}/blob/main/readme.md) for usage.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
